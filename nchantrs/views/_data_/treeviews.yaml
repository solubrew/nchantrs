NchantdSimpleTreeView:
  width: 250
  height: 675
  Animated: False
  IndentSize: 8
  url: '{0}/themes/_data_/img'
  stylesheet: >
    QTreeView::branch:has-siblings:!adjoins-item {
      border-image: url( stylesheet-vline.png ) 0;
    }
    QTreeView::branch:has-siblings:adjoins-item {
    	border-image: url( stylesheet-branch-more.png ) 0;
    }
    QTreeView::branch:!has-children:!has-siblings:adjoins-item {
    	border-image: url( stylesheet-branch-end.png ) 0;
    }
    QTreeView::branch:has-children:!has-siblings:closed,
    QTreeView::branch:closed:has-children:has-siblings {
    	border-image: none;
      image: url( <[url]>/stylesheet-branch-closed.png );
    }
    QTreeView::branch:open:has-children:!has-siblings,
    QTreeView::branch:open:has-children:has-siblings {
    	border-image: none;
      image: url( stylesheet-branch-open.png );
    }
  actions:
    keyboard:
    left_click:
    middle_click:
    right_click:
      0: add_sibling_node
      1: add_child_node
      2: edit_node
      3: duplicate_node
      4: add_subtree
      5: remove_node
nodeeditordialog:
  widget: test_nchantrs.dialogs.NchantdNodeEditor
