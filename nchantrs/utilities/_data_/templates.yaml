            class NFDCloakModel(applicationmodels.NchantdCloakModel):
            	""""""
            	def __init__(self, parent=None, cfg=None):
            		""" """
            		self.parent = parent
            		self.config = condor.Instruct(pxcfg).select('NFDCloakModel')
            		if self.parent:
            			self.config.override(parent.config)
            		self.config.override(cfg)
            		super(NFDCloakModel, self).__init__(self.parent, self.config)
            		self.accounts = None

            	def initModel(self, reset=None):
            		""""""
            		super().initModel(reset)
            		return self

            	def addAsset(self):
            		"""
            		Add Asset to application
            			db entry - ASSET, trnodes, tabs
            		:return:
            		"""
            		return self

            	def addDebit(self):
            		"""
            		Add Debit to application
            			db entry - DEBIT, trnodes, tabs
            		:return:
            		"""
            		return self

            	def addExpense(self):
            		"""
            		Add Expense to application
            			db entry - EXPENSE, trnodes, tabs

            		launch a dialog

            		:return:
            		"""
            		dialog = NchantdDialog(self.parent, self.config).initWidget()
            		if dialog['recurring']:
            			self.parent.tree.model.addRecurringExpenseNode()
            		self.parent.model.store.docs['db'].write("")

            		return self

            	def addReceipt(self):
            		"""
            		:return:
            		"""
            		return self


            class NFDTreeModel(treemodels.NchantdTimeTreeModel):
