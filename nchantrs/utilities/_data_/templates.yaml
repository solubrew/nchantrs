            # -*- coding: utf-8 -*
            # ======================================Standard Library Modules======================================================||
            import sys
            from os.path import abspath, dirname, join

            # ======================================3rd Party Library Modules=====================================================||

            # ======================================Solutions Brewer Library Modules==============================================||
            from condor import condor
            from nchantrs.nchantrs import NchantdCloak
              from ogma.logma import Logma

            # ====================================================================================================================||
            here = join(dirname(__file__), '')  # ||
            log = True
            logma = Logma(__name__)

            # ====================================================================================================================||
            pxcfg = join(here, '_data_', '<[app_name_lower]>.yaml')

            class <[app_name]>(NchantdCloak):
            	""" """
            	def __init__(self, args, parent=None):
            		""" """
            		self.config = condor.Instruct(pxcfg).load().addArgs(args)
            		if parent:
            			self.config.override(parent.config)
            		super(<[app_name]>, self).__init__('<[app_name]>', self.config)
            		self.application_NCD = 'e3b42fcc-2473-4143-820e-0dbf1322983b'
            		self.model = <[app_code_name]>CloakModel(self, self.config)
            		self.initApp()

            	def setup(self):
            		""""""
            		self.applicationSetup()
            		return self

            	def applicationSetup(self):
            		""" """
            		self.newApp = True
            		self.instanceSetup()
            		self.newApp = False
            		return self
            	def instanceSetup(self):
            		""" """
            		self.newInstance = True
            		self.model.updateData()
            		self.newInstance = False
            		return self


