            		table = 'trnodes'
            		pid = "066a7eb3-d4e8-7011-8000-0965a5d8112e"
            		cfg = {"WHERE": {"EQUAL": {"parentid" : [pid]}}}
            		account_nodes = next(self.parent.parent.model.store.docs['db'].read({"table": [table]}, cfg)).dikt[table]['df']
            		pos = len(account_nodes['name'].values.tolist())
            		for account in self.parent.parent.model.accounts['name'].values.tolist():
            			if account not in account_nodes['name'].values.tolist():
            				self.addAccountNode(account, pid, pos)
            				pos += 1

            		# table = 'ASSETS'
