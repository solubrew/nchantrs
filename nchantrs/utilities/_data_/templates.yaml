            class NFDTabSetModel(NchantdTabSetModel):
            	"""
            	Setup actions will be ran on an run of a new application or new instance of the application
            	updates will be ran each time an application is opened when new_applicaiton/new_instance is False

            	"""

            	def __init__(self, parent, cfg):
            		""""""
            		self.config = condor.Instruct(pxcfg).select('NFDTabSetModel')
            		if parent:
            			self.config.override(parent.config)
            		self.config.override(cfg)
            		super(NFDTabSetModel, self).__init__(parent, self.config)

            	def initModel(self, pos, node, newInstance=False):
            		""""""
            		super().initModel(pos, node, newInstance)

            		return self

