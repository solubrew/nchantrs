            	def addAccountNode(self, account, pid, pos=0):
            		""""""
            		self.addAccountTabSet(self.add_node(account, 'node', pid, pos))
            		return self

            	def addAccountTabSet(self, pid, pos=0):
            		"""

            		#add tabset for account
            			#Account Overview page
            			#Account Institution web page
            			#Account Settings Page - have api setup here and account edits

            		:param pid:
            		:param pos:
            		:return:
            		"""
            		self.add_tab('Overview', pid, pos, 'NchantdAccountOverviewDashBoard')
            		pos += 1
            		self.add_tab('Home Page', pid, pos, 'NchantdBrowser')
            		pos += 1
            		self.add_tab('Account Settings', pid, pos, 'NchantdAccountSettingsPane')
            		return self

