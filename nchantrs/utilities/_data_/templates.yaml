---
NchantdApplicationSkeleton:
  version: 0.0
  folder_structure:
    top:
      _data_:
        <[app_name]>.yaml:
      app:
        _data_:
          models.yaml:
            text: >
              <[app_code_name]>TreeModel:
                dstruct:
                  database:
                    objects:
                      table:
                        trnodes:
                          records:
        widgets:
          _data_:
        models.py:
          text: >
            # @@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@||
