                  vdmc.hash_txt as content_hash_txt,
                  vdmc.content_enc64_txt
                FROM vw_doc_media dm
                INNER JOIN (
                  SELECT
                    pUUID,
                    entry_int,
                    MAX(version_int) AS max_version_int  -- Find the maximum version for each pUUID
                  FROM vw_doc_media_content dmc
                  GROUP BY 1, 2
                ) AS dmc ON dm.did = dmc.pUUID 
                INNER JOIN vw_doc_media_content vdmc ON dmc.pUUID = vdmc.pUUID and dmc.max_version_int = vdmc.version_int
                WHERE dm.document_type_txt in ('note');
          vw_link:
            description: >
            cmd: >
              CREATE VIEW vw_link AS 
                SELECT
                  link_PK,
                  UUID,
                  name_txt,
                  type_txt,
                  description_ltxt,
                  url_ltxt,
                  tags_list
              FROM link
              WHERE ACTIVE_BIT = 1 AND DELETE_BIT = 0 AND ARCHIVE_BIT = 0
          vw_link_affiliate:
            cmd:
              CREATE VIEW vw_link_affiliate AS
                SELECT
                  l.link_PK,
                  l.name_txt,
                  l.type_txt,
                  l.description_ltxt,
                  l.url_ltxt,
                  la.link_PK AS affiliate_link_PK,
                  la.name_txt AS affiliate_name_txt,
                  la.type_txt AS affiliate_type_txt,
                  la.description_ltxt AS affiliate_description_ltxt,
                  la.url_ltxt AS affiliate_url_ltxt
                FROM (
                  SELECT
                    l.link_PK,
                    l.name_txt,
                    l.type_txt,
                    l.description_ltxt,
                    l.url_ltxt
                  FROM link l
                  WHERE l.type_txt <> 'affiliate'
                ) l
                INNER JOIN (
                  SELECT
                    l.link_PK,
                    l.name_txt,
                    l.type_txt,
                    l.description_ltxt,
                    l.url_ltxt
                  FROM link l
                  WHERE l.type_txt = 'affiliate'
                ) la ON l.name_txt = la.name_txt
          vw_marked_deleted:
            cmd:
              CREATE VIEW vw_marked_deleted AS
                SELECT
                  app_action_PK PK,
                  MODON_DTTM,
                  "app_action" 'table'
                FROM app_action vaa
                WHERE vaa.DELETE_BIT = 1
                UNION
                SELECT
                  app_document_type_PK PK,
                  MODON_DTTM,
                  "app_document_type" 'table'
                FROM app_document_type vadt
                WHERE vadt.DELETE_BIT = 1
                UNION
                SELECT
                  app_event_PK PK,
                  MODON_DTTM,
                  "app_event" 'table'
                FROM app_event vae
                WHERE vae.DELETE_BIT = 1
                UNION
                SELECT
                  app_instance_PK PK,
                  MODON_DTTM,
                  "app_instance" 'table'
                FROM app_instance vaa
                WHERE vaa.DELETE_BIT = 1
                UNION
                SELECT
                  app_menu_PK PK,
                  MODON_DTTM,
                  "app_menu" 'table'
                FROM app_menu vam
                WHERE vam.DELETE_BIT = 1
                UNION
                SELECT
                  app_option_PK PK,
