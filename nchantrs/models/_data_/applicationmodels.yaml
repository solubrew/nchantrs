                  vao.*
                FROM vw_app_option vao
                WHERE vao.table_txt = 'colors'
          'vw_contact':
            cmd:
              CREATE VIEW vw_contact AS
              SELECT
                contact.value_txt AS ContactName,
                contact_detail.key_txt AS ContactMethod,
                contact_detail.label_txt AS ContactContext,
                contact_detail.value_txt AS Contact
              FROM (
                SELECT
                  vao.UUID,
                  vao.key_txt,
                  vao.label_txt,
                  vao.value_txt
                FROM vw_app_option vao
                WHERE vao.table_txt = 'contact'
              ) contact
              INNER JOIN (
                SELECT
                vao.UUID,
                vao.key_txt,
                vao.label_txt,
                vao.value_txt,
                vao.pUUID
                FROM vw_app_option vao
                WHERE vao.table_txt = 'contact_detail'
              ) contact_detail ON contact.UUID = contact_detail.PUUID
          'vw_document':
            cmd: >
              CREATE VIEW vw_document AS
                SELECT
                  dm.doc_media_PK,
                  dm.did,
                  dm.name_txt,
                  dm.description_ltxt,
                  dm.path_txt,
                  dm.store_location_txt,
                  dm.syntax_txt,
                  dm.encoding_txt,              
                  dm.tags_dict,
                  dm.hash_txt,
                  dm.meta_data_enc64_dict,
                  dm.compatibility_txt,
                  dm.document_type_txt,
                  dm.filename_txt,
                  dm.version_int,
                  dm.policy_FK,
                  dm.CREBY_FK,
                  dm.CREON_DTTM,
                  dm.MODBY_FK,
                  dm.MODON_DTTM,
                  vdmc.UUID as content_UUID,
                  vdmc.page_int,
                  vdmc.entry_int,
                  vdmc.version_int as content_version_int,
                  vdmc.hash_txt as content_hash_txt,
                  vdmc.content_enc64_txt
                FROM vw_doc_media dm
                INNER JOIN (
                  SELECT
                    pUUID,
                    entry_int,
                    MAX(version_int) AS max_version_int  -- Find the maximum version for each pUUID
                  FROM vw_doc_media_content dmc
                  GROUP BY 1, 2
                ) AS dmc ON dm.did = dmc.pUUID 
                INNER JOIN vw_doc_media_content vdmc ON dmc.pUUID = vdmc.pUUID and dmc.max_version_int = vdmc.version_int
                WHERE dm.document_type_txt not in ('note');
          'vw_document_app':
            cmd: >
              CREATE VIEW vw_document_app AS
                SELECT
                  vam.app_media_PK,
                  vam.did,
                  vam.name_txt,
                  vam.description_ltxt,
                  vam.path_txt,
                  vam.store_location_txt,
                  vam.syntax_txt,
                  vam.encoding_txt,              
                  vam.tags_dict,
                  vam.hash_txt,
                  vam.meta_data_enc64_dict,
                  vam.compatibility_txt,
                  vam.document_type_txt,
                  vam.filename_txt,
                  vam.version_int,
                  vam.policy_FK,
                  vam.CREBY_FK,
                  vam.CREON_DTTM,
                  vam.MODBY_FK,
                  vam.MODON_DTTM,
                  vvamc.UUID as content_UUID,
                  vvamc.page_int,
                  vvamc.entry_int,
                  vvamc.version_int as content_version_int,
                  vvamc.hash_txt as content_hash_txt,
                  vvamc.content_enc64_txt
                FROM vw_app_media vam
                INNER JOIN (
                  SELECT
                    pUUID,
                    entry_int,
                    MAX(version_int) AS max_version_int  -- Find the maximum version for each pUUID
                  FROM vw_app_media_content
                  GROUP BY 1, 2
                ) AS vamc ON vam.did = vamc.pUUID 
                INNER JOIN vw_app_media_content vvamc ON vvamc.pUUID = vamc.pUUID and vamc.max_version_int = vvamc.version_int;
          vw_document_note:
            description:
            cmd: >
              CREATE VIEW vw_document_note AS
                SELECT
                  dm.doc_media_PK,
                  dm.did,
