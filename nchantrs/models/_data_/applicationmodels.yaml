                  "app_option" 'table'
                FROM app_option vao
                WHERE vao.DELETE_BIT = 1
                UNION
                SELECT
                  app_option_key_PK PK,
                  MODON_DTTM,
                  "app_option_key" 'table'
                FROM app_option_key vaok
                WHERE vaok.DELETE_BIT = 1
                UNION
                SELECT
