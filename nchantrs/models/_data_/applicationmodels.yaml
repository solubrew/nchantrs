                  MODON_DTTM,
                  "app_policy" 'table'
                FROM app_policy vap
                WHERE vap.DELETE_BIT = 1
                UNION
                SELECT
                  app_profile_PK PK,
                  MODON_DTTM,
                  "app_profile" 'table'
                FROM app_profile vap0
                WHERE vap0.DELETE_BIT = 1
                UNION
                SELECT
                  app_secure_store_PK PK,
                  MODON_DTTM,
                  "app_secure_store" 'table'
                FROM app_secure_store vass
                WHERE vass.DELETE_BIT = 1
                UNION
                SELECT
                  app_tab_PK PK,
                  MODON_DTTM,
                  "app_tab" 'table'
                FROM app_tab vat
                WHERE vat.DELETE_BIT = 1
                UNION
                SELECT
                  app_tree_node_PK PK,
                  MODON_DTTM,
                  "app_tree_node" 'table'
                FROM app_tree_node vatn
                WHERE vatn.DELETE_BIT = 1
                UNION
                SELECT
                  app_user_PK PK,
                  MODON_DTTM,
                  "app_user" 'table'
                FROM app_user vau
                WHERE vau.DELETE_BIT = 1
                UNION
                SELECT
                  doc_media_PK PK,
                  MODON_DTTM,
                  "doc_media" 'table'
                FROM doc_media vdm
                WHERE vdm.DELETE_BIT = 1
                UNION
                SELECT
                  doc_media_content_PK PK,
                  MODON_DTTM,
                  "doc_media_content" 'table'
                FROM doc_media_content vdmc
                WHERE vdmc.DELETE_BIT = 1
                UNION
                SELECT
                  doc_tab_PK PK,
                  MODON_DTTM,
                  "doc_tab" 'table'
                FROM doc_tab vdt
                WHERE vdt.DELETE_BIT = 1      
                UNION
                SELECT
                  doc_tree_node_PK PK,
                  MODON_DTTM,
                  "doc_tree_node" 'table'
                FROM doc_tree_node vdtn
                WHERE vdtn.DELETE_BIT = 1
                UNION
                SELECT
                  doc_user_PK PK,
                  MODON_DTTM,
                  "doc_user" 'table'
                FROM doc_user vdu
                WHERE vdu.DELETE_BIT = 1
                UNION
                SELECT
                  link_PK PK,
                  MODON_DTTM,
                  "link" 'table'
                FROM link l
                WHERE l.DELETE_BIT = 1
                ORDER BY 1, 2, 3
          vw_maint_doc_media_content:
            description:
            cmd: >
              CREATE VIEW vw_maint_doc_media_content AS 
                SELECT 
                  doc_media_content_PK,
