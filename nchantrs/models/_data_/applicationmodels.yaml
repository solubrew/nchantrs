NchantdPantiesModel:
  'name': 'Nchantd Panties Model'
  'description':
    The configurations for the generic Nchantd Cloak Application Model
    including data for aspects of launching a new nchantd application and/or
    new instances of running a new nchantd application
  dstruct:
    filesystem:
      linux:
        config:
            description: >
                The config path holds a configuration file that is used for tracking installation paths
                and other basic install data needed before the application database is spun up
            path: "<[user_home]>/.config/delta/<[application_slug]>/config.yaml"
        application:
            description: >
                The application path holds the install application executable
            path: "<[user_home]>/.local/share/delta/<[application_slug]>/"
        instance:
            description: >
                The instance path holds instance specific databases that represent Nchantrs Files
            path: "<[user_home]>/Document/delta/NchantdLibrary/<[application_slug]>/<[instance]>/"
        library:
            description: >
                The library path holds locally connected files
            path: "<[user_home]>/Documents/delta/NchantdLibrary/"
#        shortcut:
#            description: >
#                The shortcut path is the location where the launch shortcut is placed
#            path: "<[user_home]>/.local/share/applications/<[application_slug]>.desktop"
#            text: |
#              [Desktop Entry]
#              Version=0.0.1.0.1.1
#              Name=Nchantd Office
#              Exec=bash <[user_home]>/EDN/cmds/launch_nchantdoffice.sh
#              Icon=<[user_home]>/.local/share/nchantdoffice/launch_icon.svg
#              Type=Application
#              Terminal=false
#              Categories=Office;Utility;
#              StartupNotify=true
        icon:
            path: "<[user_home]>/.config/<[application_slug]>/<[application_icon]>.svg"
      mac:
        local:
            path:
        config:
            path: "<[user_home]>/Library/Preferences/<[application_slug]>"
        instance:
            path:
        library:
            path: "<[user_home]>/Library/Application/<[application_slug]>/NchantdLibrary"
      windows:
        config:
            path: "<[user_home]>\\.config\\<[application_slug]>"
        install:
            path:
        program:
            path: "C:\\Program Files\\<[application_slug]>"
        local:
            path: "<[user_home]>\\AppData\\Local\\<[application_slug]>"
        library:
            path:
