NchantdNewInstanceWizard:
  dstruct:
    database:
      objects:
        view:
      attach:
        view:
            vwt_doc_media_:
                cmd: >
                    CREATE TEMP VIEW vwt_doc_media_<[instance_id]> AS
                    SELECT
                        *
                    FROM main.vw_doc_media
                    UNION
                    SELECT
                        *
                    FROM <[instance_id]>.vw_doc_media
