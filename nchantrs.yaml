# Nchantrs Configuration

application:
  name: nchantrs
  version: "1.0.0"
  description: Advanced PyQt6 Application Framework

project:
  name: sasquatch
  type: library
features:
  widgets: true
  dialogs: true
  models: true
  views: true
  wizards: true
  extensions: true

ui:
  theme: default
  style: fusion
  icon_theme: default

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
