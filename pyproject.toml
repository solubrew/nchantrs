[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "nchantrs"
version = "0.0.1.0.1.1"
description = "Your project description"
readme = { file = "README.rst", content-type = "text/x-rst" }
license = { file = "LICENSE" }
authors = [{ name = "Maintainers", email = "solubrew@solutionsbrewer.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pyside6",
    "pyyaml",
    "pandas",
    "pyyaml-include>=1.3",
    "dnspython",
    "websockets",
    "certifi",
    "sqlalchemy",
    "alembic",
    "diskcache",
    "requests",
    "aiohttp",
    "httpx",
    "cryptography",
    "pycryptodome",
    "bcrypt",
    "PyQtWebEngine",
    "qscintilla",
    "arrow",
    "psutil",
    "jsonschema",
    "ruamel-yaml",
    "networkx",
    "pillow",
    "bs4",
    "send2trash",
    "dill",
    "zmq",
    "uuid7",
    "matplotlib",
    "mplfinance",
    "numpy",
    "plotly",
    "seaborn",
    "wordcloud",
    "pyside6pandas",
    "feedparser",
    "plyer",
    "pytest",
    # External dependencies not automatically detected
    "config",
    "pyqt5",
    "setuptools",  # provides pkg_resources
    "uuid_extensions",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "flake8",
    "pylint",
    "mypy",
    "pyright",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "coverage",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings",
    "pymdown-extensions",
]
lint = [
    "ruff",
    "bandit",
    "safety",
]
optional = [
    "pyqt5",
    "config",
    "uuid_extensions",
    "nchantdoffice",
    "cons",
    "fxsquirl",
]
legacy = [
    "pkg_resources",
]
all = [
    "nchantrs[dev,test,docs,lint,optional,legacy]",
]

[project.urls]
Homepage = "https://www.solutionsbrewer.com/"
Changelog = "CHANGELOG.rst"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
dependencies = { file = ["requirements"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["nchantrs", "nchantrs.*"]
exclude = [
    "test*",
    "tests*",
    "docs*",
    "examples*",
    "scripts*",
    "tools*",
]

[tool.setuptools.package-data]
nchantrs = [
  "**/*.yaml", "**/*.qss", "**/*.svg", "**/*.png"
]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["nchantrs"]

[tool.black]
line-length = 120
skip-string-normalization = false

[tool.flake8]
exclude = [
    ".tox",
    ".git",
    "__pycache__",
    ".eggs",
    "*.egg",
    "build",
    "dist",
    "htmlcov",
]
ignore = ["FI15", "FI16", "FI17", "FI5", "D107"]

[tool.pytest.ini_options]
testpaths = ["tests"]
mock_use_standalone_module = true
norecursedirs = [
    ".git",
    ".tox",
    ".env",
    "__pycache__",
    "dist",
    "build",
    "htmlcov",
]
collect_ignore = ["hook-*.py"]
python_files = [
    "test_*.py",
    "*_test.py",
    "tests.py",
]
addopts = [
    "-rxEfsw",
    "--strict",
    "--doctest-modules",
    "--doctest-glob=*.md",
    "--tb=short",
]

[tool.setuptools.package.metadata]
license = { file = "LICENSE" }

[tool.pyright]
include = ["nchantrs"]
exclude = ["**/__pycache__", "test_nchantrs"]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.11"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
