[tool.black]
line-length = 120
skip-string-normalization = false

[tool.flake8]
exclude = [
    ".tox",
    ".git",
    "__pycache__",
    ".eggs",
    "*.egg",
    "build",
    "dist",
    "htmlcov",
]
ignore = ["FI15", "FI16", "FI17", "FI5", "D107"]

[tool.pytest.ini_options]
testpaths = ["tests"]
mock_use_standalone_module = true
norecursedirs = [
    ".git",
    ".tox",
    ".env",
    "__pycache__",
    "dist",
    "build",
    "htmlcov",
]
collect_ignore = ["hook-*.py"]
python_files = [
    "test_*.py",
    "*_test.py",
    "tests.py",
]
addopts = [
    "-rxEfsw",
    "--strict",
    "--doctest-modules",
    "--doctest-glob=*.md",
    "--tb=short",
]


[tool.pyright]
include = ["nchantrs"]
exclude = ["**/__pycache__", "test_nchantrs"]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.11"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
