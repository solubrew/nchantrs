[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "nchantrs"
version = "0.0.1.0.1.1"
description = "Python module for rapidly building PySide6/PyQt5 desktop apps from YAML configuration and Python widget files, with SQLite-backed state via FxSQuiRL."
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE.md" }
authors = [{ name = "Maintainers", email = "solubrew@solutionsbrewer.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pyside6",
    "pyyaml",
    "pandas",
    "pyyaml-include>=1.3",
    "dnspython",
    "websockets",
    "certifi",
    "sqlalchemy",
    "alembic",
    "diskcache",
    "requests",
    "aiohttp",
    "httpx",
    "cryptography",
    "pycryptodome",
    "bcrypt",
    "PyQtWebEngine",
    "qscintilla",
    "arrow",
    "psutil",
    "jsonschema",
    "ruamel-yaml",
    "networkx",
    "pillow",
    "bs4",
    "send2trash",
    "dill",
    "zmq",
    "uuid7",
    "matplotlib",
    "mplfinance",
    "numpy",
    "plotly",
    "seaborn",
    "wordcloud",
    "plyer",
    "pytest",
    # External dependencies not automatically detected
    "setuptools",  # provides pkg_resources
    "uuid7",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "flake8",
    "pylint",
    "mypy",
    "pyright",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "coverage",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings",
    "pymdown-extensions",
]
lint = [
    "ruff",
    "bandit",
    "safety",
]
optional = [
]
#legacy = [
#    "pkg_resources",
#]
all = [
    "nchantrs[dev,test,docs,lint,optional,legacy]",
]

[project.urls]
Homepage = "https://www.solutionsbrewer.com/"

[tool.setuptools]
# Minimal setuptools_scm config
[tool.setuptools_scm]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["nchantrs", "nchantrs.*"]
exclude = [
    "test*",
    "tests*",
    "docs*",
    "examples*",
    "scripts*",
    "tools*",
]

[tool.setuptools.package-data]
nchantrs = [
  "**/*.yaml", "**/*.qss", "**/*.svg", "**/*.png"
]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["nchantrs"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# We use the E/F/W default ruleset (matches the legacy
# ``select = ["E", "F", "I", "N", "W"]`` from earlier drafts).
select = ["E", "F", "I", "N", "W"]
# E501 (line too long) is enforced via line-length above.
ignore = ["E501"]

# Per-file overrides for files that contain stub functions
[tool.ruff.lint.per-file-ignores]
"nchantrs/**/*.py" = [
  # F401: re-exports in __init__.py (e.g. from .widgets.managers.managers import NchantdBasket) are flagged as unused but the whole point of __init__.py is to re-export.
  "F401",
  # N802: PySide6 / PyQt5 method overrides (mousePressEvent,
  # keyPressEvent, paintEvent, focusInEvent, ...) MUST keep
  # camelCase per the Qt API contract. The project also defines
  # initModel / initView / initWidget as project-level methods
  # which legitimately use camelCase even though Python
  # convention would prefer snake_case — this is an explicit
  # project style choice tracked in TODOs.md under
  # "T-NEW-105: rename internal camelCase methods to snake_case".
  "N802",
  # N806: non-lowercase variable names inside functions.
  # Mostly ``cfg`` / ``db`` / ``fx`` / ``mod`` (DB-driver
  # conventions) and Qt enum values like ``Qt.AlignCenter``.
  # Renaming would diverge from PySide6 documentation patterns.
  "N806",
  # N815: mixedCase variable in class scope. ``parent``,
  # ``config``, ``logger``, ``signalMapper`` etc. are common
  # PySide6 / SB-stack conventions.
  "N815",
  # N803: argument name not lowercase. ``self``, ``cfg``,
  # ``parent`` are conventions shared across PySide6 code.
  "N803",
  # W191: tabs in the META block header. The ``<(META)>``
  # blocks use tabs for visual indentation of metadata fields
  # (a docs-convention); they're plain string literals so the
  # tabs do not affect Python semantics.
  "W191",
]
# Tests follow the same conventions; the same per-file
# applies to test code that mirrors project style.
"tests/**/*.py" = [
  "F401", "N802", "N806", "N815", "N803", "W191",
]
# F821 / E402 in known-stub files: these files contain stub
# functions awaiting foliation (T-NEW-105 work). The stubs
# reference names like ``self``, ``logma``, ``kahndor`` and
# PySide6 classes (``Signal``, ``QBasicTimer``) as if they were
# inside a class, because they were scaffolded against the
# real signature without the surrounding class body. Real
# fixes require promoting each stub into its proper class.
# Until that work is done (tracked in TODOs.md /
# PROJECT_TRACKER.yaml as separate tasks), suppress the
# false-positive F821 + E402 noise so the dim score reflects
# real issues in real code rather than 540+ stub references.
"nchantrs/actions/tables.py" = ["E402", "F401", "F811", "F821", "E741", "N816", "N818", "N999"]
