[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "flake8",
    "pylint",
    "mypy",
    "pyright",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "coverage",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings",
    "pymdown-extensions",
]
lint = [
    "ruff",
    "bandit",
    "safety",
]
all = [
    "nchantrs[dev,test,docs,lint]",
]

[project]
name = "nchantrs"
version = "0.0.1.0.1.1"
#dynamic = ["version"]
description = "Your project description"
readme = { file = "README.rst", content-type = "text/x-rst" }
license = { file = "LICENSE" }
authors = [{ name = "Maintainers", email = "solubrew@solutionsbrewer.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Utilities"]
# Modern dependencies - removed obsolete Python 2/3 compatibility packages
dependencies = [
    # Core
    "pyside6",
    "pyyaml",
    "pandas",
    "pyyaml-include>=1.3",
    "dnspython",
    "websockets",
    "certifi",
    
    # Database
    "sqlalchemy",
    "alembic",
    "diskcache",
    
    # Web/API
    "requests",
    "aiohttp",
    "httpx",
    
    # Security
    "cryptography",
    "pycryptodome",
    "bcrypt",
    
    # GUI
    "PyQtWebEngine",
    "qscintilla",
    
    # Utilities
    "arrow",
    "psutil",
    "jsonschema",
    "ruamel-yaml",
    "networkx",
    "black",
    "pillow",
    
    # Optional/misc
    "bs4",
    "send2trash",
    "dill",
    "zmq",
    "uuid7",
    
    # Graphics & Visualization
    "matplotlib",
    "mplfinance",
    "numpy",
    "plotly",
    "seaborn",
    "wordcloud",
    
    # Data Processing
    "pyside6pandas",
    "feedparser",
    
    # Platform Utilities
    "plyer",
    
    # Testing
    "pytest",
    
    # Optional/conditional imports (may not always be available)
    "pyqt5",  # Optional: for PyQt5 compatibility
    "config",  # Optional: for config parsing
    
    # External packages used in codebase
    "uuid_extensions",  # UUID extensions
    "nchantdoffice",  # Office integration  
    "cons",  # Console utilities
    "fxsquirl",  # FxSquirl integration
    "pillow",  # PIL fork
]

[project.optional-dependencies]
# Conditional/optional dependencies
optional = [
    "pyqt5",  # Optional: PyQt5 fallback
    "config",  # Optional: config module
    "uuid_extensions",  # Optional: UUID extensions
    "nchantdoffice",  # Optional: Office integration
    "cons",  # Optional: console utilities
    "fxsquirl",  # Optional: FxSquirl integration
]
# Legacy/compatibility
legacy = [
    "pkg_resources",  # Part of setuptools
]
# All extras
all = [
    "nchantrs[dev,test,docs,lint,optional,legacy]",
]

[project.urls]
Homepage = "https://www.solutionsbrewer.com/"
Changelog = "CHANGELOG.rst"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
dependencies = { file = ["requirements"] }

#[tool.nchantrs.versioning]
#internal-version = "0.0.1.0.1.1"
#public-version = "0.0.1.0.1.1"
#version-mapping = "parts[0].parts[1].parts[2]"
#version = "0.0.1.0.1.1"
# Flat layout: project root contains "nchantrs" and a sibling "test_nchantrs".
# Limit discovery to only the actual package.
[tool.setuptools.packages.find]
where = ["."]
include = ["nchantrs", "nchantrs.*"]
exclude = [
    "test*",
    "tests*",
    "docs*",
    "examples*",
    "scripts*",
    "tools*",
]
[tool.setuptools.package-data]
# keys are package names; globs are relative to the package dirs
nchantrs = [
  "**/*.yaml", "**/*.qss", "**/*.svg", "**/*.png"
]
[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["nchantrs"]

[tool.black]
line-length = 120
skip-string-normalization = false

# Flake8 configuration
[tool.flake8]
exclude = [
    ".tox",
    ".git",
    "__pycache__",
    ".eggs",
    "*.egg",
    "build",
    "dist",
    "htmlcov",
    "*/static/salt/formulas/*"]
ignore = ["FI15", "FI16", "FI17", "FI5", "D107"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["test"]
mock_use_standalone_module = true
norecursedirs = [
    ".git",
    ".tox",
    ".env",
    "__pycache__",
    "dist",
    "build",
    "htmlcov"]
collect_ignore = ["hook-*.py"]
python_files = [
    "test_*.py",
    "*_test.py",
    "tests.py"]
addopts = [
    "-rxEfsw",
    "--strict",
    "--doctest-modules",
    "--doctest-glob=*.md",
    "--tb=short"]

[tool.setuptools.package.metadata]
license = { file = "LICENSE" }


[tool.pyright]
include = ["nchantrs"]
exclude = ["**/__pycache__", "test_nchantrs"]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.11"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
