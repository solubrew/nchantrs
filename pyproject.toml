[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "nchantrs"
version = "0.0.1.0.1.1"
#dynamic = ["version"]
description = "Your project description"
readme = { file = "README.rst", content-type = "text/x-rst" }
license = { file = "LICENSE" }
authors = [{ name = "Maintainers", email = "solubrew@solutionsbrewer.com" }]
requires-python = ">=3.6"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Utilities"]
# Dependencies with environment markers preserved from the original config
dependencies = [
    "backoff",
    "click",
    'defusedxml; platform_system == "Windows"',
    'futures; python_version < "3"',
    'six; platform_system == "Linux" and python_version > "3.3"',
    'pypiwin32; platform_system == "Windows"',
    'wheel<=0.29.0; python_version < "2.7"',
    "pyside6",
    "pyyaml",
    "pandas",
    "pyyaml-include==1.3",
    "dnspython",
    "websockets",
    "certifi",
    "pyodbc",
    "mysql-connector-python",
    "mysql-connector",
    "sqlalchemy",
    "diskcache",
    "bs4",
    "html5lib",
    "requests",
    "moviepy",
    "PyQtWebEngine",
    "qscintilla",
    "arrow",
    "pygame",
    "uuid7",
    "send2trash",
    "dill",
    "pycryptodome",
    "cryptography",
    "rsa",
    "web3",
    "coincurve",
    "feedparser",
    "python-vlc",
    "scikit-learn",
    "ecdsa",
    "base58",
    "pylnk",
    "plotly",
    "wordcloud",
    "mplfinance",
    "zmq",
    "psutil",
    "black",
    "jsonschema",
    'ruamel-yaml',
    'networkx',
    'bcrypt',
]

[project.urls]
Homepage = "https://www.solutionsbrewer.com/"
Changelog = "CHANGELOG.rst"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
dependencies = { file = ["requirements"] }

#[tool.nchantrs.versioning]
#internal-version = "0.0.1.0.1.1"
#public-version = "0.0.1.0.1.1"
#version-mapping = "parts[0].parts[1].parts[2]"
#version = "0.0.1.0.1.1"
# Flat layout: project root contains "nchantrs" and a sibling "test_nchantrs".
# Limit discovery to only the actual package.
[tool.setuptools.packages.find]
where = ["."]
include = ["nchantrs", "nchantrs.*"]
exclude = [
    "test*",
    "tests*",
    "docs*",
    "examples*",
    "scripts*",
    "tools*",
]
[tool.setuptools.package-data]
# keys are package names; globs are relative to the package dirs
nchantrs = [
  "**/*.yaml", "**/*.qss", "**/*.svg", "**/*.png"
]
[tool.black]
line-length = 120
skip-string-normalization = false

# Flake8 configuration
[tool.flake8]
exclude = [
    ".tox",
    ".git",
    "__pycache__",
    ".eggs",
    "*.egg",
    "build",
    "dist",
    "htmlcov",
    "*/static/salt/formulas/*"]
ignore = ["FI15", "FI16", "FI17", "FI5", "D107"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["test"]
mock_use_standalone_module = true
norecursedirs = [
    ".git",
    ".tox",
    ".env",
    "__pycache__",
    "dist",
    "build",
    "htmlcov"]
collect_ignore = ["hook-*.py"]
python_files = [
    "test_*.py",
    "*_test.py",
    "tests.py"]
addopts = [
    "-rxEfsw",
    "--strict",
    "--doctest-modules",
    "--doctest-glob=*.md",
    "--tb=short"]